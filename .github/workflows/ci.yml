name: Desktop CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: brew install ripgrep
      - name: Build and test
        run: zsh ./scripts/test.sh
      - name: Build release archive
        run: zsh ./scripts/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: dist/*
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove regression against v1.3.1
        shell: powershell
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP 'CodexData-v1.3.1.cs'
          git show v1.3.1:Windows/CodexData.cs | Set-Content $baseline -Encoding UTF8
          if ($LASTEXITCODE -ne 0) { throw 'Could not read released baseline' }
          $output = & powershell -NoProfile -ExecutionPolicy Bypass -File tests/windows-executable-discovery.ps1 -SourcePath $baseline
          $code = $LASTEXITCODE
          $output | Write-Output
          if ($code -ne 1 -or ($output -join "`n") -notmatch 'FAIL modern-npm-nested:') {
            throw 'Expected the released version to fail modern npm discovery'
          }
          Write-Output 'Red baseline confirmed'
          exit 0
      - name: Test Windows executable discovery
        shell: powershell
        run: ./tests/windows-executable-discovery.ps1
      - name: Test Windows protocol
        shell: powershell
        run: ./Windows/CodexQuotaHUD.ps1 -SelfTest
      - name: Compile Windows HUD
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Web.Extensions,System.Windows.Forms,System.Drawing
          $source = [IO.File]::ReadAllText("$pwd/Windows/CodexData.cs") + [Environment]::NewLine + [IO.File]::ReadAllText("$pwd/Windows/Hud.cs")
          Add-Type -TypeDefinition $source -ReferencedAssemblies System,System.Web.Extensions,System.Windows.Forms,System.Drawing,System.Core
          $hud = New-Object CodexMonitor.Hud
          $hud.Dispose()
      - name: Package Windows portable edition
        shell: powershell
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: dist/*
